<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - Backend Engineer</title>
<style>.dropdown-location{padding:4px;cursor:pointer}</style></head>
<body>
<!-- Mimics Lever: wrapping labels, card questions whose text sits in .application-label,
     a location box with its own suggestion dropdown, and EEO selects inside labels. -->
<form id="application-form">
<ul>
  <li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div>
    <div class="application-field"><a>ATTACH RESUME/CV</a><input type="file" name="resume" id="resume-upload-input" style="opacity:0;position:absolute;width:1px;height:1px"></div></label></li>
  <li class="application-question"><label><div class="application-label">Full name <span class="required">✱</span></div>
    <div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email <span class="required">✱</span></div>
    <div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Phone</div>
    <div class="application-field"><input type="text" name="phone"></div></label></li>
  <li class="application-question"><label><div class="application-label">Current location <span class="required">✱</span></div>
    <div class="application-field"><input type="text" name="location" id="location-input" required><input type="hidden" id="selected-location" name="selectedLocation">
      <div class="dropdown-results"></div></div></label></li>
  <li class="application-question"><label><div class="application-label">Current company</div>
    <div class="application-field"><input type="text" name="org"></div></label></li>
  <li class="application-question custom-question"><div><div class="application-label"><div class="text">Are you legally authorized to work in the country for which you are applying? <span class="required">✱</span></div></div>
    <div class="application-field"><ul>
      <li><label><input type="radio" name="cards[a][field0]" value="Yes" required><span>Yes</span></label></li>
      <li><label><input type="radio" name="cards[a][field0]" value="No" required><span>No</span></label></li></ul></div></div></li>
  <li class="application-question custom-question"><div><div class="application-label"><div class="text">Please tell us how you heard about this opportunity. <span class="required">✱</span></div></div>
    <div class="application-field"><select name="cards[b][field0]" required><option value="">Select...</option><option>LinkedIn</option><option>Job Board (Indeed, Monster, etc.)</option><option>Other</option></select></div></div></li>
  <li class="application-question custom-question"><div><div class="application-label"><div class="text">What has been your favorite project?</div></div>
    <div class="application-field"><textarea name="cards[c][field0]"></textarea></div></div></li>
  <li><label>Veteran status<select name="eeo[veteran]"><option value="">Select ...</option><option>I am a protected veteran</option><option>I am not a protected veteran</option><option>I decline to self-identify for protected veteran status</option></select></label></li>
</ul>
<button type="submit">Submit application</button>
</form>
<script>
  const loc = document.getElementById("location-input");
  const box = loc.parentElement.querySelector(".dropdown-results");
  loc.addEventListener("input", () => {
    box.innerHTML = "";
    document.getElementById("selected-location").value = "";
    if (loc.value.length < 2) return;
    [`${loc.value}, CA, USA`, `${loc.value}, Somewhere Else`].forEach((t) => {
      const d = document.createElement("div");
      d.className = "dropdown-location";
      d.textContent = t;
      d.onclick = () => { loc.value = t; document.getElementById("selected-location").value = t; box.innerHTML = ""; };
      box.appendChild(d);
    });
  });
  document.getElementById("application-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    const ok = f.name.value && f.email.value && document.getElementById("selected-location").value &&
      f.querySelector("input[type=radio]:checked") && f.elements["cards[b][field0]"].value && f.resume.files.length;
    if (!ok) { alert("missing"); return; }
    document.body.innerHTML = "<p>Application submitted! Thanks for applying to Acme.</p>";
  });
</script>
</body></html>
