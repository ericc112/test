<!doctype html>
<html><head><meta charset="utf-8"><title>Acme Careers (Workday-like)</title>
<style>
  body { font: 14px sans-serif; margin: 20px; }
  .ff { margin: 10px 0; } label { display: block; }
  .btnwrap { position: relative; display: inline-block; }
  .btnwrap [data-automation-id="click_filter"] { position: absolute; inset: 0; }
  [role=listbox] { border: 1px solid #999; margin: 0; padding: 0; list-style: none; }
  [role=option], [data-automation-id=promptOption] { padding: 4px; cursor: pointer; }
  .trap { position: absolute; left: -9999px; }
</style></head>
<body><div id="app"></div>
<script>
// A small stand-in for a Workday career site: posting → Apply → account → 5 steps → Review → Submit.
const params = new URLSearchParams(location.search);
let account = params.get("account") === "1";
let signedIn = false, view = "job", step = 0;
const STEPS = ["Create Account/Sign In", "My Information", "My Experience", "Application Questions", "Voluntary Disclosures", "Review"];
const values = {};
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function progress() {
  return `<ol data-automation-id="progressBar">${STEPS.map((s, i) => i === step
    ? `<li data-automation-id="progressBarActiveStep">current step ${i + 1} of 6 ${s}</li>`
    : `<li data-automation-id="progressBarInactiveStep">step ${i + 1} of 6 ${s}</li>`).join("")}</ol>`;
}
const button = (id, text) => `<span class="btnwrap"><button data-automation-id="${id}">${text}</button><div data-automation-id="click_filter"></div></span>`;
const text = (id, label, req) => `<div class="ff" data-automation-id="formField-${id}"><label for="${id}">${label}${req ? "*" : ""}</label>
  <input type="text" id="${id}" value="${esc(values[id] || "")}" ${req ? 'aria-required="true"' : ""}></div>`;
const listbox = (id, label, req, opts) => `<div class="ff" data-automation-id="formField-${id}"><label>${label}${req ? "*" : ""}</label>
  <button type="button" aria-haspopup="listbox" data-lb="${id}" data-opts="${esc(JSON.stringify(opts))}">${esc(values[id] || "Select One")}</button></div>`;
const radio = (id, label, opts) => `<div class="ff" data-automation-id="formField-${id}"><fieldset><legend>${label}*</legend>
  ${opts.map((o, i) => `<input type="radio" name="${id}" id="${id}${i}" value="${o}" ${values[id] === o ? "checked" : ""}><label for="${id}${i}">${o}</label>`).join("")}</fieldset></div>`;

function render(errors = []) {
  let h = "";
  if (view === "job") {
    h = `<h2 data-automation-id="jobPostingHeader">Finance Intern, Summer 2027</h2><a href="#" data-automation-id="adventureButton">Apply</a>
      <div id="popup" hidden><a href="#" data-automation-id="applyManually">Apply Manually</a></div>`;
  } else if (view === "create" || view === "signin") {
    const create = view === "create";
    h = progress() + `<h2>${create ? "Create Account" : "Sign In"}</h2>
      <div class="ff"><label>Email Address*</label><input data-automation-id="email" type="text"></div>
      <div class="ff"><label>Password*</label><input data-automation-id="password" type="password"></div>
      ${create ? `<div class="ff"><label>Verify New Password*</label><input data-automation-id="verifyPassword" type="password"></div>
      <div class="ff"><input type="checkbox" id="cac" data-automation-id="createAccountCheckbox"><label for="cac">I agree</label></div>` : ""}
      <input class="trap" type="text" data-automation-id="beecatcher" tabindex="-1">
      ${create ? button("createAccountSubmitButton", "Create Account") + button("signInLink", "Sign In")
               : button("signInSubmitButton", "Sign In") + button("createAccountLink", "Create Account")}`;
  } else if (view === "steps") {
    const body = {
      1: `<div class="ff" data-automation-id="formField-source"><label>How Did You Hear About Us?*</label>
            <div data-automation-id="multiselectInputContainer"><input type="text" id="srcq"></div>
            ${values.source ? `<div data-automation-id="selectedItem">${esc(values.source)}</div>` : ""}<div id="srcopts"></div></div>`
         + text("firstName", "First Name", true) + text("lastName", "Last Name", true)
         + listbox("state", "State", true, ["Alabama", "California", "New York", "Texas"])
         + text("phone", "Phone Number", true) + radio("previousWorker", "Have you previously worked for Acme?", ["Yes", "No"]),
      2: `<div class="ff" data-automation-id="formField-resume"><label>Resume/CV*</label><input type="file" id="resume">
            ${values.resume ? `<div data-automation-id="file-upload-successful">${esc(values.resume)}</div>` : ""}</div>`
         + text("linkedin", "LinkedIn", false),
      3: listbox("auth", "Are you legally authorized to work in the United States?", true, ["Yes", "No"])
         + listbox("sponsor", "Will you now or in the future require sponsorship for employment visa status?", true, ["Yes", "No"])
         + listbox("office", "Which Acme office would you prefer?", true, ["Minneapolis", "New York"]),
      4: listbox("gender", "Gender", false, ["Male", "Female", "I do not wish to answer"])
         + `<div class="ff" data-automation-id="formField-agreement"><input type="checkbox" id="agree" ${values.agree ? "checked" : ""}>
            <label for="agree">I have read and consent to the terms and conditions*</label></div>`,
      5: `<h3>Review</h3><pre>${esc(JSON.stringify(values, null, 1))}</pre>`,
    }[step];
    h = progress() + body + errors.map((e) => `<div data-automation-id="errorMessage">${esc(e)}</div>`).join("")
      + `<div data-automation-id="bottom-navigation-next-button" role="button" tabindex="0">${step === 5 ? "Submit" : "Save and Continue"}</div>`;
  } else if (view === "done") {
    h = `<h2>Application Submitted</h2><p>Thank you for applying to Acme.</p>`;
  }
  app.innerHTML = h;
}

const REQUIRED = { 1: ["source", "firstName", "lastName", "state", "phone", "previousWorker"], 2: ["resume"],
                   3: ["auth", "sponsor", "office"], 4: ["agree"] };
const LABELS = { source: "How Did You Hear About Us?", firstName: "First Name", lastName: "Last Name", state: "State",
                 phone: "Phone Number", previousWorker: "Have you previously worked for Acme?", resume: "Resume/CV",
                 auth: "Are you legally authorized to work in the United States?",
                 sponsor: "Will you now or in the future require sponsorship for employment visa status?",
                 office: "Which Acme office would you prefer?", agree: "I have read and consent to the terms and conditions" };
function collect() {
  document.querySelectorAll("input[type=text][id]").forEach((i) => { if (i.id !== "srcq") values[i.id] = i.value; });
  document.querySelectorAll("input[type=radio]:checked").forEach((r) => (values[r.name] = r.value));
  const agree = document.getElementById("agree"); if (agree) values.agree = agree.checked;
}

document.addEventListener("click", (e) => {
  const t = e.target;
  const id = t.getAttribute("data-automation-id") === "click_filter" ? t.previousElementSibling.getAttribute("data-automation-id")
                                                                     : t.getAttribute("data-automation-id");
  if (id === "adventureButton") { e.preventDefault(); document.getElementById("popup").hidden = false; return; }
  if (id === "applyManually") { e.preventDefault(); view = "create"; render(); return; }
  if (id === "signInLink") { view = "signin"; render(); return; }
  if (id === "createAccountLink") { view = "create"; render(); return; }
  const v = (a) => (document.querySelector(`[data-automation-id="${a}"]`) || {}).value || "";
  if (id === "signInSubmitButton") {
    if (!account) return render(["Wrong email address or password."]);
    signedIn = true; view = "steps"; step = 1; return render();
  }
  if (id === "createAccountSubmitButton") {
    if (v("beecatcher")) return render(["Something went wrong."]);  // the bot trap was filled
    if (!v("email") || v("password").length < 8 || v("password") !== v("verifyPassword")
        || !document.querySelector('[data-automation-id="createAccountCheckbox"]').checked) return render(["Please complete all fields."]);
    account = signedIn = true; view = "steps"; step = 1; return render();
  }
  if (id === "bottom-navigation-next-button") {
    collect();
    if (step === 5) { view = "done"; return render(); }
    const miss = (REQUIRED[step] || []).filter((k) => !values[k]);
    if (miss.length) return render(miss.map((k) => `Error: The field ${LABELS[k]} is required and must have a value.`));
    step += 1; return render();
  }
  const lb = t.closest("[data-lb]");
  if (lb) {
    collect();
    const opts = JSON.parse(lb.getAttribute("data-opts"));
    const ul = document.createElement("ul"); ul.setAttribute("role", "listbox");
    ul.innerHTML = opts.map((o) => `<li role="option">${esc(o)}</li>`).join("");
    ul.addEventListener("click", (ev) => { values[lb.getAttribute("data-lb")] = ev.target.textContent; render(); });
    lb.after(ul); return;
  }
  if (t.getAttribute("data-automation-id") === "promptOption") {
    collect();
    const label = t.textContent;
    if (label === "Job Board") {
      document.getElementById("srcopts").innerHTML = ["LinkedIn", "Indeed", "Handshake"].map((o) => `<div data-automation-id="promptOption">${o}</div>`).join("");
      return;
    }
    values.source = label; render(); return;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelectorAll("[role=listbox]").forEach((u) => u.remove());
  if (e.key === "Enter" && e.target.id === "srcq") {
    document.getElementById("srcopts").innerHTML = ["Job Board", "Social Media", "Company Website"]
      .map((o) => `<div data-automation-id="promptOption">${o}</div>`).join("");
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "resume" && e.target.files.length) { collect(); values.resume = e.target.files[0].name; render(); }
});
render();
</script></body></html>
