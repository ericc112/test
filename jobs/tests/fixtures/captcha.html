<!doctype html>
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form id="f"><label for="n">Full name *</label><input id="n" required><label for="e">Email *</label><input id="e" type="email" required>
<button type="submit">Submit application</button></form>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const fr = document.createElement("iframe");
    fr.src = "about:blank#recaptcha/api2/bframe";
    fr.style.width = "300px"; fr.style.height = "300px";
    document.body.appendChild(fr);
  });
</script>
</body></html>
