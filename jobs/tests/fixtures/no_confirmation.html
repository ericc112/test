<!doctype html>
<html><head><meta charset="utf-8"><title>Careers at Acme</title></head>
<body>
<!-- A form that accepts the application and lands on a plain careers page:
     no "thank you", no "submitted", nothing the confirmation check can match. -->
<form id="application-form" novalidate>
  <div><label for="first_name">First Name<span>*</span></label><input id="first_name" type="text" aria-required="true"></div>
  <div><label for="last_name">Last Name<span>*</span></label><input id="last_name" type="text" aria-required="true"></div>
  <div><label for="email">Email<span>*</span></label><input id="email" type="text" aria-required="true"></div>
  <div class="field"><div class="label">Resume/CV*</div>
    <div><button type="button">Attach</button><label for="resume">Attach</label>
      <input id="resume" type="file" style="position:absolute;width:1px;height:1px;opacity:0"></div>
    <p>Accepted file types: pdf, doc, docx, txt</p></div>
  <button type="submit">Submit application</button>
</form>
<script>
  document.getElementById("application-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const missing = [];
    ["first_name", "last_name", "email"].forEach((id) => { if (!document.getElementById(id).value) missing.push(id); });
    if (!document.getElementById("resume").files.length) missing.push("resume");
    if (missing.length) {
      const a = document.getElementById("err") || document.body.insertBefore(Object.assign(document.createElement("div"), { id: "err" }), document.body.firstChild);
      a.setAttribute("role", "alert");
      a.textContent = "Please complete: " + missing.join(", ");
      return;
    }
    document.body.innerHTML = "<h1>Acme Careers</h1><p>Explore open roles and learn more about life at Acme.</p>";
  });
</script>
</body></html>
